name: Build and Release Desktop App

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller pillow

      - name: Extract version from tag
        id: version
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build executable (updates version.json + version_local.json)
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.VERSION }}
          RELEASE_NOTES: ${{ github.event.head_commit.message }}
        run: python scripts/build_app.py

      - name: Install Inno Setup
        run: |
          choco install innosetup --no-progress -y
        shell: powershell

      - name: Compile Installer (Inno Setup)
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer.iss
        shell: powershell

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          name: "Cgl Regulation Explorer v${{ steps.version.outputs.VERSION }}"
          body: |
            ## What's New in v${{ steps.version.outputs.VERSION }}

            See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for full details.

            ## Download

            | File | Description |
            |------|-------------|
            | `cgl_setup.exe` | **Recommended** — Windows installer (creates Start Menu & desktop shortcut) |
            | `cgl_regulation.exe` | Portable single-file executable (no installation needed) |

            ## How to Update

            Download and run the new installer. It will replace the previous version automatically.
          files: |
            dist/cgl_setup.exe
            dist/cgl_regulation.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
